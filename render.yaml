# Free-tier interview demo. Do not remove plan: free.
# Omitting plan creates a paid 0.5 CPU instance.
# Do not add a worker, cron, Postgres, or Key Value service here.
# Those types are billed, or their free databases expire.
# PostgreSQL is Neon. Redis is Upstash. Both are external.

services:
  - type: web
    name: payguard-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEBHOOK_SANDBOX_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: BCRYPT_ROUNDS
        value: "10"

  - type: web
    name: payguard-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
